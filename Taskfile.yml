version: "3"

vars:
  EXT_NAME: hello-translate
  VERSION:
    sh: node -p "require('./manifest.json').version"
  RELEASE_VERSION: '{{default "" .RELEASE_VERSION}}'
  DIST_DIR: dist
  PACKAGE_FILE: "{{.DIST_DIR}}/{{.EXT_NAME}}-{{.VERSION}}.zip"
  PUBLISHER_ID: '{{default "" .CHROME_PUBLISHER_ID}}'
  EXTENSION_ID: '{{default "" .CHROME_EXTENSION_ID}}'
  ACCESS_TOKEN: '{{default "" .CHROME_WEBSTORE_TOKEN}}'

tasks:
  default:
    cmds:
      - task: local

  local:
    desc: Rebuild the unpacked extension for local Chrome use
    vars:
      LOCAL_DIR: "{{.DIST_DIR}}/{{.EXT_NAME}}-local"
    cmds:
      - task: validate
      - rm -rf {{.LOCAL_DIR}}
      - mkdir -p {{.LOCAL_DIR}}
      - cp manifest.json background.js content.js popup.html popup.css popup.js options.html options.css options.js {{.LOCAL_DIR}}/
      - cp -R icons {{.LOCAL_DIR}}/icons
      - echo "Ready. Load dist/hello-translate-local via chrome://extensions -> Load unpacked."

  publish:
    desc: Build and publish the git-tagged release in Chrome Web Store
    vars:
      TAG_VERSION:
        sh: git describe --tags --exact-match HEAD | sed 's/^v//'
    preconditions:
      - sh: printf "%s" "{{.TAG_VERSION}}" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'
        msg: HEAD must have a version tag such as v0.1.0.
      - sh: test -n "{{.PUBLISHER_ID}}"
        msg: Set CHROME_PUBLISHER_ID.
      - sh: test -n "{{.EXTENSION_ID}}"
        msg: Set CHROME_EXTENSION_ID.
      - sh: test -n "{{.ACCESS_TOKEN}}"
        msg: Set CHROME_WEBSTORE_TOKEN.
    cmds:
      - task: webstore-deploy-release
        vars:
          RELEASE_VERSION: "{{.TAG_VERSION}}"

  validate:
    cmds:
      - node --check background.js
      - node --check content.js
      - node --check popup.js
      - node --check options.js
      - node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))"
      - test -f icons/icon-16.png
      - test -f icons/icon-32.png
      - test -f icons/icon-64.png
      - test -f icons/icon-128.png

  set-version:
    preconditions:
      - sh: test -n "{{.RELEASE_VERSION}}"
        msg: RELEASE_VERSION is required.
      - sh: printf "%s" "{{.RELEASE_VERSION}}" | grep -Eq '^[0-9]+(\.[0-9]+){1,3}$'
        msg: RELEASE_VERSION must be a Chrome-compatible dotted version.
    cmds:
      - >
        node -e "const fs=require('fs');
        const path='manifest.json';
        const manifest=JSON.parse(fs.readFileSync(path,'utf8'));
        manifest.version='{{.RELEASE_VERSION}}';
        fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');"

  package:
    cmds:
      - task: validate
      - mkdir -p {{.DIST_DIR}}
      - rm -f {{.PACKAGE_FILE}}
      - zip -r {{.PACKAGE_FILE}} manifest.json background.js content.js popup.html popup.css popup.js options.html options.css options.js icons

  package-release:
    cmds:
      - task: set-version
        vars:
          RELEASE_VERSION: "{{.RELEASE_VERSION}}"
      - task: package
        vars:
          PACKAGE_FILE: "{{.DIST_DIR}}/{{.EXT_NAME}}-{{.RELEASE_VERSION}}.zip"

  webstore-upload-existing:
    preconditions:
      - sh: test -f "{{.PACKAGE_FILE}}"
        msg: Package file {{.PACKAGE_FILE}} does not exist.
    cmds:
      - >
        curl --fail-with-body
        -H "Authorization: Bearer {{.ACCESS_TOKEN}}"
        -H "Content-Type: application/zip"
        -X POST
        --data-binary @{{.PACKAGE_FILE}}
        "https://chromewebstore.googleapis.com/upload/v2/publishers/{{.PUBLISHER_ID}}/items/{{.EXTENSION_ID}}:upload"

  webstore-publish:
    cmds:
      - >
        curl --fail-with-body
        -H "Authorization: Bearer {{.ACCESS_TOKEN}}"
        -X POST
        "https://chromewebstore.googleapis.com/v2/publishers/{{.PUBLISHER_ID}}/items/{{.EXTENSION_ID}}:publish"

  webstore-deploy-release:
    cmds:
      - task: package-release
        vars:
          RELEASE_VERSION: "{{.RELEASE_VERSION}}"
      - task: webstore-upload-existing
        vars:
          PACKAGE_FILE: "{{.DIST_DIR}}/{{.EXT_NAME}}-{{.RELEASE_VERSION}}.zip"
      - task: webstore-publish
